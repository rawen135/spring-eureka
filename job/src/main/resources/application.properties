spring.application.name=job
server.port=8082

spring.datasource.url=${JOB_DB_URL:jdbc:mysql://localhost:3306/job_db?createDatabaseIfNotExist=true}
spring.datasource.username=${JOB_DB_USERNAME:root}
spring.datasource.password=${JOB_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=3000

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.healthcheck.enabled=true
eureka.instance.prefer-ip-address=true
eureka.instance.status-page-url-path=/actuator/info
eureka.instance.health-check-url-path=/actuator/health

management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Job
info.app.version=1.0.0
info.app.description=Microservice de gestion des offres
