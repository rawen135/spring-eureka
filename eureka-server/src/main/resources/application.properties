spring.application.name=eureka
server.port=8761
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
# Seuil assoupli pour cet atelier local afin que les variations de heartbeats
# des services de démonstration ne déclenchent pas le mode de préservation.
eureka.server.renewal-percent-threshold=0.50
# Recalcul rapide pour que le seuil reflète les services après leur démarrage.
eureka.server.renewal-threshold-update-interval-ms=60000
